<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Try on the 17.63 ct Heart Modified Brilliant</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--bg:#fbf6ec;--ink:#3a2a1a;--gold:#b8862f;--line:#e3d3ac}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:"Cormorant Garamond",Georgia,serif;font-size:18px;display:flex;flex-direction:column}
header{padding:14px 16px 8px;text-align:center;border-bottom:1px solid var(--line)}
header h1{margin:0;font-weight:500;font-size:22px;color:var(--gold);letter-spacing:.04em}
header p{margin:2px 0 0;font-size:15px}
#stage{position:relative;flex:1;min-height:0;background:#1b1510}
canvas{width:100%;height:100%;object-fit:contain;display:block}
#msg{position:absolute;left:12px;right:12px;bottom:12px;padding:10px 14px;background:rgba(251,246,236,.94);border:1px solid var(--line);text-align:center;font-size:16px}
#start{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;background:var(--bg);padding:24px;text-align:center}
#start p{max-width:30ch;margin:0}
button,select{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--gold);padding:8px 14px;border-radius:2px}
button.primary{background:var(--gold);color:#fff;font-size:20px;padding:12px 26px}
button:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.controls{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:center;padding:10px 12px calc(10px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line)}
.controls label{display:flex;gap:8px;align-items:center;font-size:16px}
.hidden{display:none!important}
</style>
</head>
<body>
<header>
  <h1>17.63 ct Heart Modified Brilliant</h1>
  <p>Fancy Intense Yellow colour, VS2 clarity. GIA 5232738687. 15.47 x 17.57 x 8.66 mm</p>
</header>

<div id="stage">
  <canvas id="c"></canvas>
  <div id="msg" class="hidden"></div>
  <div id="start">
    <p>See this diamond on your own hand, at its true size.</p>
    <p>Hold your hand up with the back of the hand facing the camera.</p>
    <button class="primary" id="go">Start camera</button>
    <p id="err" style="color:#9b2c2c"></p>
  </div>
</div>

<div class="controls">
  <label>Finger
    <select id="finger">
      <option value="13,14">Ring</option>
      <option value="9,10">Middle</option>
      <option value="5,6">Index</option>
      <option value="17,18">Little</option>
    </select>
  </label>
  <label>Metal
    <select id="metal">
      <option value="yellow">Yellow gold (18k)</option>
      <option value="white">White gold (18k)</option>
      <option value="rose">Rose gold (18k)</option>
    </select>
  </label>
  <label>Hand size
    <input id="size" type="range" min="60" max="85" value="70">
  </label>
  <button id="flip">Switch camera</button>
</div>

<video id="v" playsinline muted class="hidden"></video>

<script type="module">
import { FilesetResolver, HandLandmarker } from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/vision_bundle.mjs";

// ---- Stone data (change these for each stone) ----
// shape: emerald, round, oval, cushion, princess, radiant, asscher, pear, marquise, heart
const STONE = {"shape": "heart", "lengthMM": 17.57, "widthMM": 15.47};

const $ = id => document.getElementById(id);
const video = $("v"), canvas = $("c"), ctx = canvas.getContext("2d");
let landmarker, facing = "user", lastTime = -1;
const sm = { x: 0, y: 0, a: 0, s: 0, ok: false }; // smoothed pose

function say(t){ const m=$("msg"); if(t){m.textContent=t;m.classList.remove("hidden")}else m.classList.add("hidden"); }

async function startCamera(){
  if (video.srcObject) video.srcObject.getTracks().forEach(t => t.stop());
  const stream = await navigator.mediaDevices.getUserMedia({
    video: { facingMode: facing, width: { ideal: 1280 }, height: { ideal: 720 } }, audio: false });
  video.srcObject = stream;
  await video.play();
  canvas.width = video.videoWidth; canvas.height = video.videoHeight;
}

async function init(){
  $("err").textContent = "";
  try {
    $("go").disabled = true; $("go").textContent = "Loading...";
    const fileset = await FilesetResolver.forVisionTasks("https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm");
    landmarker = await HandLandmarker.createFromOptions(fileset, {
      baseOptions: { modelAssetPath: "https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task", delegate: "GPU" },
      runningMode: "VIDEO", numHands: 1 });
    await startCamera();
    $("start").classList.add("hidden");
    say("Show the back of your hand to the camera.");
    requestAnimationFrame(loop);
  } catch (e) {
    $("go").disabled = false; $("go").textContent = "Start camera";
    $("err").textContent = "Camera could not start. Allow camera access in your browser settings and try again.";
    console.error(e);
  }
}

const d = (a,b) => Math.hypot(a.x-b.x, a.y-b.y);
const lerp = (a,b,t) => a+(b-a)*t;

function loop(){
  requestAnimationFrame(loop);
  if (video.readyState < 2) return;
  const W = canvas.width, H = canvas.height, mirror = facing === "user";
  ctx.save();
  if (mirror){ ctx.translate(W,0); ctx.scale(-1,1); }
  ctx.drawImage(video, 0, 0, W, H);

  if (video.currentTime !== lastTime){
    lastTime = video.currentTime;
    const res = landmarker.detectForVideo(video, performance.now());
    const h = res.landmarks && res.landmarks[0];
    if (h){
      const [i,j] = $("finger").value.split(",").map(Number);
      const A = {x:h[i].x*W, y:h[i].y*H}, B = {x:h[j].x*W, y:h[j].y*H};
      const knuckle = d({x:h[5].x*W,y:h[5].y*H}, {x:h[17].x*W,y:h[17].y*H});
      const pxPerMM = knuckle / Number($("size").value);
      // ring sits on the section of finger between the knuckle and the first joint
      const t = 0.42;
      const tx = lerp(A.x,B.x,t), ty = lerp(A.y,B.y,t);
      const ang = Math.atan2(B.y-A.y, B.x-A.x) - Math.PI/2; // stone long axis along the finger
      const k = sm.ok ? 0.35 : 1;
      sm.x = lerp(sm.x,tx,k); sm.y = lerp(sm.y,ty,k); sm.s = lerp(sm.s,pxPerMM,k);
      let da = ang - sm.a; da = Math.atan2(Math.sin(da), Math.cos(da));
      sm.a += da*k; sm.ok = true; sm.miss = 0;
      sm.tilt = lerp(sm.tilt||0, Math.max(-.15, Math.min(.15, (h[5].z - h[17].z)*(mirror?-1:1))), 0.25);
      sampleEnvironment();
      say("");
    } else if (++sm.miss > 8){ sm.ok = false; say("Show the back of your hand to the camera."); }
  }
  if (sm.ok) drawRing(sm.x, sm.y, sm.a, sm.s);
  ctx.restore();
}

// ---- Realistic metal rendering ----
// Each metal: deep shadow, dark reflection, mid, body, light, highlight, specular
const METALS = {
  yellow: { name:"18k yellow gold", c:["#3a2203","#7a4c0c","#b9842a","#dcae4c","#f3d27e","#fff2cc","#fffbea"], tint:"#e9b949" },
  white:  { name:"18k white gold",  c:["#3b4046","#737a82","#a9afb6","#cdd1d6","#e6e9ec","#f8fafc","#ffffff"], tint:"#dfe3e8" },
  rose:   { name:"18k rose gold",   c:["#3a1a10","#7a3d2a","#b8735c","#d8957d","#efbea9","#fde6db","#fff6f1"], tint:"#e3a28a" }
};

// small blurred copy of the camera image, reflected into the metal
const env = document.createElement("canvas"); env.width = 48; env.height = 16;
const envCtx = env.getContext("2d", { willReadFrequently: true });
let sceneLum = 0.5;
function sampleEnvironment(){
  envCtx.drawImage(video, 0, 0, env.width, env.height);
  const px = envCtx.getImageData(0, 0, env.width, env.height).data;
  let L = 0; for (let i = 0; i < px.length; i += 4) L += 0.2126*px[i] + 0.7152*px[i+1] + 0.0722*px[i+2];
  sceneLum = lerp(sceneLum, L/(px.length/4)/255, 0.1);
}

// fine grain so the metal does not look like flat vector colour
const grain = document.createElement("canvas"); grain.width = grain.height = 64;
{ const g = grain.getContext("2d"), id = g.createImageData(64,64);
  for (let i = 0; i < id.data.length; i += 4){ const n = 110 + Math.random()*36; id.data[i]=id.data[i+1]=id.data[i+2]=n; id.data[i+3]=255; }
  g.putImageData(id,0,0); }
let grainPat = null;

const clamp01 = v => Math.min(1, Math.max(0, v));

// Where the claws sit for each diamond shape (x across the finger, y along it; tip claws point outward)
function prongPoints(shape, w, h){
  const P = (x,y,tip) => ({ x, y, ang: Math.atan2(y, x) - Math.PI/2, tip: !!tip });
  const corners = f => [[-1,-1],[1,-1],[-1,1],[1,1]].map(([sx,sy]) => P(sx*(w/2 - f), sy*(h/2 - f)));
  switch (shape){
    case "emerald": return corners(w*0.165*0.42);
    case "asscher": return corners(w*0.22*0.42);
    case "radiant": return corners(w*0.12*0.42);
    case "princess": return corners(w*0.02);
    case "cushion": return [[-1,-1],[1,-1],[-1,1],[1,1]].map(([sx,sy]) => P(sx*w/2*0.84, sy*h/2*0.84));
    case "round": case "oval": return [[-1,-1],[1,-1],[-1,1],[1,1]].map(([sx,sy]) => P(sx*w/2*0.72, sy*h/2*0.72));
    case "pear": return [P(0,-h/2+0.3,true), P(-w/2*0.92,h*0.12), P(w/2*0.92,h*0.12), P(-w/2*0.6,h/2*0.8), P(w/2*0.6,h/2*0.8)];
    case "marquise": return [P(0,-h/2+0.3,true), P(0,h/2-0.3,true), P(-w/2*0.86,-h*0.2), P(w/2*0.86,-h*0.2), P(-w/2*0.86,h*0.2), P(w/2*0.86,h*0.2)];
    case "heart": return [P(0,h/2-0.3,true), P(-w/2*0.9,-h*0.12), P(w/2*0.9,-h*0.12), P(0,-h/2*0.62)];
    default: return corners(w*0.1);
  }
}

// one tiny pave diamond on the band, with its own twinkle
function paveStone(cx, cy, r, fx, phase, tt, tilt){
  ctx.save(); ctx.translate(cx,cy); ctx.scale(Math.max(0.15,fx),1);
  const g = ctx.createRadialGradient(-r*0.2,-r*0.25,0, 0,0,r);
  g.addColorStop(0,"#ffffff"); g.addColorStop(.35,"#e6ecf1"); g.addColorStop(.65,"#8d97a1"); g.addColorStop(.88,"#4a525b"); g.addColorStop(1,"#2a2f35");
  ctx.beginPath(); ctx.arc(0,0,r,0,Math.PI*2); ctx.fillStyle = g; ctx.fill();
  // table facet
  ctx.beginPath(); for (let k=0;k<8;k++){ const q=k*Math.PI/4+Math.PI/8; ctx.lineTo(Math.cos(q)*r*0.48, Math.sin(q)*r*0.48); }
  ctx.closePath(); ctx.fillStyle = "rgba(255,255,255,.35)"; ctx.fill();
  ctx.restore();
  // sparkle: flashes as the hand moves, like real pave
  const f = Math.sin(tt*2.3 + phase + tilt*40);
  if (f > 0.82){
    const k = (f-0.82)/0.18, L = r*(1.4 + 1.6*k);
    ctx.save(); ctx.globalCompositeOperation = "lighter"; ctx.translate(cx,cy);
    ctx.strokeStyle = `rgba(255,255,255,${0.85*k})`; ctx.lineWidth = Math.max(0.6, r*0.18); ctx.lineCap = "round";
    ctx.beginPath(); ctx.moveTo(-L,0); ctx.lineTo(L,0); ctx.moveTo(0,-L); ctx.lineTo(0,L); ctx.stroke();
    const sg = ctx.createRadialGradient(0,0,0,0,0,r*1.2); sg.addColorStop(0,`rgba(255,255,255,${k})`); sg.addColorStop(1,"rgba(255,255,255,0)");
    ctx.fillStyle = sg; ctx.fillRect(-r*1.2,-r*1.2,r*2.4,r*2.4); ctx.restore();
  }
}

function drawRing(x, y, a, s){
  const w = STONE.widthMM*s, h = STONE.lengthMM*s;
  const tt = performance.now()/1000, tilt = sm.tilt||0;
  const M = METALS[$("metal").value] || METALS.yellow, m = M.c;
  const lx = -Math.sin(a), ly = -Math.cos(a); // direction toward the light, in ring space
  const shift = tilt*1.6 + lx*0.06 + 0.012*Math.sin(tt*0.9);
  ctx.save(); ctx.translate(x,y); ctx.rotate(a);

  // ---- slim band that wraps round the finger (true cylinder projection) ----
  const R = (Number($("size").value)/70)*9.2*s;   // finger radius follows the hand-size slider
  const half = 1.0*s;                               // ~2 mm band, like a delicate solitaire
  const uMax = R*Math.PI/2*0.97, N = 40;
  const proj = u => ({ x: R*Math.sin(u/R), drop: R*(1-Math.cos(u/R))*0.16, f: Math.cos(u/R) });
  const bandPath = () => { ctx.beginPath();
    for (let i=0;i<=N;i++){ const u=-uMax+2*uMax*i/N, p=proj(u), t=half*(0.55+0.45*Math.sqrt(Math.max(0,p.f))); ctx.lineTo(p.x, p.drop - t); }
    for (let i=N;i>=0;i--){ const u=-uMax+2*uMax*i/N, p=proj(u), t=half*(0.55+0.45*Math.sqrt(Math.max(0,p.f))); ctx.lineTo(p.x, p.drop + t); }
    ctx.closePath(); };
  const bx = R, ht = half + R*0.16;

  const g = ctx.createLinearGradient(-bx,0,bx,0);
  const stops = [[0,0],[.03,1],[.07,3],[.105,5],[.135,6],[.165,4],[.2,2],[.24,1],[.3,3],[.5,4],[.7,3],[.76,1],[.8,2],[.835,4],[.865,6],[.895,5],[.93,3],[.97,1],[1,0]];
  stops.forEach(([p,i]) => g.addColorStop(clamp01(p===0||p===1 ? p : p+shift), m[i]));
  ctx.save(); ctx.shadowColor = "rgba(0,0,0,.45)"; ctx.shadowBlur = 3.5*s; ctx.shadowOffsetY = 1*s;
  bandPath(); ctx.fillStyle = g; ctx.fill(); ctx.restore();

  ctx.save(); bandPath(); ctx.clip();
  const big = () => ctx.fillRect(-bx-2*s,-ht-2*s,2*bx+4*s,2*ht+4*s);
  // rounded profile
  const v = ctx.createLinearGradient(0,-half,0,half);
  v.addColorStop(0, m[2]); v.addColorStop(.3,"#ffffff"); v.addColorStop(.7,"#ffffff"); v.addColorStop(1, m[1]);
  ctx.globalCompositeOperation = "multiply"; ctx.fillStyle = v; big();
  // the room reflected in the metal, re-tinted to the chosen metal
  ctx.globalCompositeOperation = "overlay"; ctx.globalAlpha = 0.3;
  ctx.save(); ctx.scale(1,-1); ctx.drawImage(env, -bx, -ht, 2*bx, 2*ht); ctx.restore();
  ctx.globalCompositeOperation = "color"; ctx.globalAlpha = $("metal").value === "white" ? 0.15 : 0.45;
  ctx.fillStyle = M.tint; big();
  // specular glints on the shoulders
  ctx.globalCompositeOperation = "lighter"; ctx.globalAlpha = 1;
  [[.135+shift,.8],[.865+shift,.9]].forEach(([p,k]) => {
    const gx = -bx + 2*bx*clamp01(p), gy = proj(Math.asin(Math.max(-1,Math.min(1,gx/R)))*R).drop - half*0.3;
    const rg = ctx.createRadialGradient(gx,gy,0, gx,gy,1.4*s);
    rg.addColorStop(0, `rgba(255,255,255,${0.7*k})`); rg.addColorStop(1,"rgba(255,255,255,0)");
    ctx.fillStyle = rg; ctx.fillRect(gx-2*s, gy-2*s, 4*s, 4*s);
  });
  ctx.globalCompositeOperation = "overlay"; ctx.globalAlpha = 0.09;
  grainPat = grainPat || ctx.createPattern(grain,"repeat"); ctx.fillStyle = grainPat; big();
  // match the brightness of the room
  const dim = Math.min(0.3, Math.max(0, (0.48 - sceneLum)*0.6));
  if (dim > 0){ ctx.globalCompositeOperation = "source-over"; ctx.globalAlpha = dim; ctx.fillStyle = "#000"; big(); }
  ctx.restore();
  bandPath(); ctx.lineWidth = 0.15*s; ctx.strokeStyle = m[0]+"aa"; ctx.stroke();

  // ---- pave diamonds along the band shoulders ----
  const pr = 0.56*s, step = 1.2*s, start = w/2 + 0.75*s;
  let n = 0;
  for (let u = start; u/R < 1.2; u += step, n++){
    [-1,1].forEach(side => {
      const p = proj(side*u); if (p.f < 0.3) return;
      const r = pr*(0.75+0.25*p.f);
      // tiny metal beads that hold each stone
      [-1,1].forEach(bs => {
        const q = proj(side*(u+step/2));
        ctx.beginPath(); ctx.ellipse(q.x, q.drop + bs*half*0.72, 0.2*s*q.f+0.3, 0.2*s, 0, 0, Math.PI*2);
        ctx.fillStyle = m[5]; ctx.fill();
      });
      paveStone(p.x, p.drop, r, p.f, n*1.7 + side*2.9, tt, tilt);
    });
  }

  // ---- the centre stone from the certificate photo, at its true size ----
  if (stoneImg.complete && stoneImg.naturalWidth){
    ctx.save(); ctx.shadowColor = "rgba(0,0,0,.45)"; ctx.shadowBlur = 7*s; ctx.shadowOffsetY = 2.2*s;
    ctx.drawImage(stoneImg, -w/2, -h/2, w, h); ctx.restore();
  }

  // ---- slim claw prongs ----
  prongPoints(STONE.shape, w, h).forEach(pt => {
    const rx = (pt.tip ? 0.6 : 0.62)*s, ry = (pt.tip ? 1.25 : 1.15)*s;
    ctx.save(); ctx.translate(pt.x,pt.y); ctx.rotate(pt.ang);
    const clx = lx*Math.cos(pt.ang)+ly*Math.sin(pt.ang), cly = -lx*Math.sin(pt.ang)+ly*Math.cos(pt.ang);
    const hx = clx*0.4*rx, hy = cly*0.4*ry;
    const pg = ctx.createRadialGradient(hx,hy,0.03*s, 0,0,ry*1.05);
    pg.addColorStop(0,m[6]); pg.addColorStop(.25,m[4]); pg.addColorStop(.6,m[3]); pg.addColorStop(.85,m[1]); pg.addColorStop(1,m[0]);
    ctx.shadowColor = "rgba(0,0,0,.4)"; ctx.shadowBlur = 1.2*s; ctx.shadowOffsetY = 0.4*s;
    ctx.beginPath();
    if (pt.tip){ ctx.moveTo(0,-ry); ctx.quadraticCurveTo(rx*1.3,0,0,ry); ctx.quadraticCurveTo(-rx*1.3,0,0,-ry); }
    else ctx.ellipse(0,0,rx,ry,0,0,Math.PI*2);
    ctx.fillStyle = pg; ctx.fill();
    ctx.shadowColor = "transparent"; ctx.globalCompositeOperation = "lighter";
    const sp = ctx.createRadialGradient(hx,hy,0, hx,hy,0.35*s);
    sp.addColorStop(0,"rgba(255,255,255,.9)"); sp.addColorStop(1,"rgba(255,255,255,0)");
    ctx.fillStyle = sp; ctx.fillRect(hx-s,hy-s,2*s,2*s);
    ctx.restore();
  });

  ctx.restore();
}

$("go").addEventListener("click", init);
$("flip").addEventListener("click", async () => {
  facing = facing === "user" ? "environment" : "user";
  try { await startCamera(); } catch(e){ console.error(e); }
});
</script>
